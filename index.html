<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBAR PRO Nurse</title>

<style>
*{
box-sizing:border-box;
}
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#f4f7fb,#eaf0f7);
    min-height:100vh;
}
/* TOPBAR */
.topbar{
height:60px;
background:#1d2248;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.card button{
background:#6c757d;
color:white;
height:auto;
padding:8px 15px;
margin-top:10px;
border-radius:8px;
font-size:13px;
}

.logo{
font-weight:700;
font-size:18px;
}

.logo .sub{
font-size:11px;
opacity:.8;
}

.title{
font-size:22px;
font-weight:700;
letter-spacing:1px;
}

.user{
background:rgba(255,255,255,.15);
padding:10px 16px;
border-radius:10px;
}

/* LAYOUT */
.layout{
display:flex;
min-height:calc(100vh - 60px);
}

.output:empty::before{
content:"Laporan SBAR akan muncul di sini...";
color:#9aa0a6;
font-style:italic;
}

/* SIDEBAR */
.sidebar{
width:220px;
background:white;
padding:25px;
box-shadow:3px 0 15px rgba(0,0,0,.05);
position:sticky;
top:0;
height:100vh;
}

.sidebar h3{
margin-top:0;
color:#1d2248;
}

.sidebar ul{
list-style:none;
padding:0;
margin:0;
}

.sidebar li{
font-weight:500;
padding:14px;
margin-bottom:8px;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

.sidebar li:hover{
background:#eef4ff;
}

.sidebar li.active{
box-shadow:0 4px 10px rgba(13,110,253,.25);
}

.sidebar .active{
background:#0d6efd;
color:white;
font-weight:600;
}

/* CONTENT */
.container{
flex:1;
padding:25px;
display:flex;
flex-direction:column;
gap:15px;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

.form-group{
display:flex;
flex-direction:column;
}

.vital-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:15px;
margin-top:10px;
}

.main-card{
background:white;
padding:30px;
border-radius:18px;
box-shadow:
0 8px 25px rgba(0,0,0,.05);
}

.button-group{
display:flex;
gap:12px;
margin-top:20px;
}

.button-group button{
flex:1;
}

/* JUDUL */
h1{
    background:linear-gradient(135deg,#198754,#20c997);
    color:white;
    padding:18px 25px;
    border-radius:12px;
    margin-top:0;
    font-size:28px;
    letter-spacing:1px;
    box-shadow:0 4px 10px rgba(25,135,84,.25);
}

/* SECTION */
h2{
    background:#f8fafc;
    border-left:6px solid #0d6efd;
    padding:14px 18px;
    border-radius:10px;
    color:#1d3557;
    font-size:19px;
    margin-top:25px;
    margin-bottom:15px;
}

/* LABEL */
label{
    font-weight:600;
    color:#4c5c68;
    margin-top:12px;
}

/* INPUT */
input,
textarea{
    width:100%;
    padding:14px;
    border:2px solid #e2e8f0;
    border-radius:10px;
    background:#fafcff;
    font-size:14px;
    transition:.3s;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.03);
}

input{
height:48px;
}

textarea{
min-height:120px;
resize:vertical;
}
input:hover,
textarea:hover{
    border-color:#bfd4ff;
}

input:focus,
textarea:focus{
    border-color:#0d6efd;
    background:white;
    box-shadow:0 0 0 4px rgba(13,110,253,.15);
}

/* BUTTON */
button{
padding:12px 20px;
border:none;
border-radius:10px;
font-weight:600;
cursor:pointer;
box-shadow:0 3px 8px rgba(0,0,0,.1);
}
.button-group button{
flex:1;
height:50px;
}
.btn-generate{
background:#0d6efd;
color:white;
}

.btn-save{
background:#198754;
color:white;
}

.btn-copy{
background:#fd7e14;
color:white;
}

.button-group button:hover{
    transform:translateY(-2px);
    filter:brightness(0.95);
}

.card button:hover{
    filter:brightness(0.9);
}

/* OUTPUT */
.output{
    background:white;
    border-left:6px solid #0d6efd;
    border-radius:15px;
    padding:25px;
    box-shadow:0 4px 15px rgba(0,0,0,.05);
    white-space:pre-wrap;
    min-height:250px;
}

/* HISTORY */
.history{
display:none;
margin-top:30px;
max-height:400px;
overflow-y:auto;
}

.card{
    background:white;
    border:none;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
    transition:.3s;
}

.card:hover{
    transform:translateY(-3px);
}

/* DESKTOP */
@media (min-width:1200px){

.form-grid{
    grid-template-columns:repeat(5,1fr);
}

.button-group button{
    flex:1;
}

} /* <-- penutup desktop */

@media(max-width:768px){

.topbar{
flex-wrap:wrap;
height:auto;
padding:10px;
gap:10px;
}

.title{
font-size:18px;
}

.layout{
flex-direction:column;
}

.sidebar{
width:100%;
position:relative;
height:auto;
}

.form-grid{
grid-template-columns:1fr;
}

.vital-grid{
grid-template-columns:1fr 1fr;
}

.button-group{
flex-direction:column;
}

}

</style>
</head>
<body>
<header class="topbar">

<div class="logo">
🏥 RS UNAIR SURABAYA
<div class="sub">
SIMRS TERINTEGRASI
</div>
</div>

<div class="title">
SBAR PRO NURSE
</div>

<div class="user">
🔔 
</div>

</header>
<div class="layout">

<aside class="sidebar">

<h3>MENU</h3>

<ul>
<li onclick="window.scrollTo({top:0,behavior:'smooth'})">
🏠 Dashboard
</li>

<li class="active">
📝 Pelaporan SBAR
</li>

<li onclick="toggleHistory()">
📂 Riwayat
</li>

<li>
👨‍⚕️ Dokter
</li>

<li>
🔔 Notifikasi
</li>
</ul>

</aside>
<div class="container">
<div class="main-card">

<h1>SBAR PRO NURSE</h1>

<h2>Data Pasien</h2>

<div class="form-grid">

<div class="form-group">
<label>Nama Pasien</label>
<input id="nama">
</div>

<div class="form-group">
<label>No RM</label>
<input id="rm">
</div>

<div class="form-group">
<label>Umur</label>
<input id="umur">
</div>

<div class="form-group">
<label>Diagnosa Medis</label>
<input id="diagnosa">
</div>

<div class="form-group">
<label>Dokter Tujuan</label>
<input id="dokter">
</div>

</div>

<h2>Situation</h2>
<textarea id="situation"></textarea>

<h2>Background</h2>
<textarea id="background"></textarea>

<h2>Assessment</h2>

<div class="vital-grid">

<div class="form-group">
<label>TD</label>
<input id="td">
</div>

<div class="form-group">
<label>Nadi</label>
<input id="nadi">
</div>

<div class="form-group">
<label>RR</label>
<input id="rr">
</div>

<div class="form-group">
<label>Suhu</label>
<input id="suhu">
</div>

<div class="form-group">
<label>SpO₂</label>
<input id="spo2">
</div>

</div>

<label>Assessment Tambahan</label>
<textarea id="assessment"></textarea>

<h2>Recommendation</h2>
<textarea id="recommendation"></textarea>


<div class="button-group">

<button class="btn-generate"
onclick="generateSBAR()">
Generate Laporan
</button>

<button class="btn-save"
onclick="saveReport()">
Simpan
</button>

<button class="btn-copy"
onclick="copyReport()">
Copy WhatsApp
</button>

</div>
<div id="hasil" class="output"></div>

<div class="history" id="historySection">
    <h2>Riwayat Laporan</h2>
    <div id="historyList"></div>
</div> <!-- history -->

</div> <!-- main-card -->
</div> <!-- container -->
</div> <!-- layout -->

<script>

let currentReport = "";

function generateSBAR(){

const nama=document.getElementById('nama').value;
const rm=document.getElementById('rm').value;
const umur=document.getElementById('umur').value;
const diagnosa=document.getElementById('diagnosa').value;
const dokter=document.getElementById('dokter').value;

const situation=document.getElementById('situation').value;
const background=document.getElementById('background').value;

const td=document.getElementById('td').value;
const nadi=document.getElementById('nadi').value;
const rr=document.getElementById('rr').value;
const suhu=document.getElementById('suhu').value;
const spo2=document.getElementById('spo2').value;

const assessment=document.getElementById('assessment').value;
const recommendation=document.getElementById('recommendation').value;

currentReport =
`LAPORAN SBAR

Dokter: ${dokter}

Nama Pasien : ${nama}
No RM : ${rm}
Umur : ${umur}
Diagnosa : ${diagnosa}

SITUATION
${situation}

BACKGROUND
${background}

ASSESSMENT
TD : ${td}
Nadi : ${nadi}
RR : ${rr}
Suhu : ${suhu}
SpO₂ : ${spo2}

${assessment}

RECOMMENDATION
${recommendation}

Narasi Profesional:

Selamat ${getGreeting()} Dokter.
Saya melaporkan pasien ${nama}, usia ${umur} tahun dengan diagnosa ${diagnosa}.

Saat ini ${situation}

Latar belakang pasien:
${background}

Hasil assessment:
TD ${td} mmHg,
Nadi ${nadi} x/menit,
RR ${rr} x/menit,
Suhu ${suhu}°C,
SpO₂ ${spo2}%.

${assessment}

Mohon evaluasi dan tindak lanjut sesuai kondisi pasien.

Rekomendasi:
${recommendation}
`;

document.getElementById('hasil').innerText=currentReport;
}

function getGreeting(){

const hour=new Date().getHours();

if(hour<12) return "pagi";
if(hour<15) return "siang";
if(hour<18) return "sore";

return "malam";
}

function saveReport(){

if(currentReport===""){
alert("Generate laporan terlebih dahulu");
return;
}

let reports=
JSON.parse(localStorage.getItem("sbarReports")) || [];

reports.push({
date:new Date().toLocaleString(),
report:currentReport
});

localStorage.setItem(
"sbarReports",
JSON.stringify(reports)
);

loadHistory();

alert("Laporan berhasil disimpan");
}

function loadHistory(){

const reports=
JSON.parse(localStorage.getItem("sbarReports")) || [];

let html="";

[...reports].reverse().forEach(item=>{

html += `
<div class="card">
<b>${item.date}</b><br>
<button onclick='showReport(${JSON.stringify(item.report)})'>
Lihat
</button>
</div>
`;

});

document.getElementById("historyList").innerHTML=html;
}

function showReport(text){
document.getElementById("hasil").innerText=text;
}

function toggleHistory(){

const history =
document.getElementById("historySection");

history.style.display = "block";

history.scrollIntoView({
behavior:"smooth"
});

}
function showHistorySection(){

document
.getElementById("historySection")
.scrollIntoView({
behavior:"smooth"
});

}
function copyReport(){

if(currentReport===""){
alert("Generate laporan dulu");
return;
}

navigator.clipboard.writeText(currentReport);

alert("Laporan berhasil dicopy");
}

loadHistory();

</script>

</body>
</html>
